[package]
name = "cinefit-kms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# KMS is Linux only; elsewhere the crate is just its timing and pattern code.
[target.'cfg(target_os = "linux")'.dependencies]
# 0.14, not 0.15: gbm 0.18 (needed later for scanout buffers) depends on 0.14.
# 0.14.2 was yanked.
drm = "0.14.1"
# Scanout buffers the GPU renders into, shared as dma-bufs.
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
# poll(2) for the flip deadline; the version drm itself uses.
rustix = { version = "0.38", features = ["event"] }

[lints]
workspace = true
