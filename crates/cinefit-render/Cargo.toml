[package]
name = "cinefit-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# One crate links libplacebo.
links = "cinefit_placebo"

# libplacebo (LGPL-2.1+) is linked statically: the pinned build from
# scripts/build-libplacebo.sh, found through CINEFIT_LIBPLACEBO.
[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[lints]
workspace = true

# The dumps test decodes each tunnel frame's own metadata.
[dev-dependencies]
cinefit-dovi = { path = "../cinefit-dovi" }
