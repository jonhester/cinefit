[package]
name = "cinefit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cinefit-decklink = { path = "../cinefit-decklink" }
cinefit-detect = { path = "../cinefit-detect" }
cinefit-dovi = { path = "../cinefit-dovi" }
cinefit-geometry = { path = "../cinefit-geometry" }
cinefit-input = { path = "../cinefit-input" }
cinefit-kms = { path = "../cinefit-kms" }
cinefit-render = { path = "../cinefit-render" }
clap = { version = "4.5", features = ["derive"] }
# termination: SIGTERM (from timeout or kill) ends a run as Ctrl-C does, so the
# capture input is stopped rather than left enabled in the driver.
ctrlc = { version = "3.4", features = ["termination"] }
# On-screen text (osd.rs): glyphs rasterised from the bundled Inter (OFL).
fontdue = "0.9"
# Logging (runlog.rs): play's lines to the terminal and to a file per run.
fern = "0.7"
log = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
# The settings file (config.rs): parsed into a table, no derive needed.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# The web page (web.rs): a small HTTP server on a thread of its own.
tiny_http = "0.12.0"
# The web page's API: settings and live status as JSON.
serde_json = "1.0.154"

[lints]
workspace = true
