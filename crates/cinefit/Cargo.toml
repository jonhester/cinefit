[package]
name = "cinefit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cinefit-decklink = { path = "../cinefit-decklink" }
cinefit-detect = { path = "../cinefit-detect" }
cinefit-dovi = { path = "../cinefit-dovi" }
cinefit-geometry = { path = "../cinefit-geometry" }
cinefit-kms = { path = "../cinefit-kms" }
cinefit-render = { path = "../cinefit-render" }
clap = { version = "4.5", features = ["derive"] }
# termination: SIGTERM (from timeout or kill) ends a run as Ctrl-C does, so the
# capture input is stopped rather than left enabled in the driver.
ctrlc = { version = "3.4", features = ["termination"] }
# The settings file (config.rs): parsed into a table, no derive needed.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
