<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cinefit</title>
<style>
  /* Dark only, on purpose: the page is read in a dark theatre. Mobile first: one column on a phone; from 900px
     the status becomes a grid of tiles beside a sticky settings column, and from 1400px the page stops growing
     so lines stay readable on a wide monitor. */
  :root {
    --bg: #0b0b10; --card: #16151d; --row: #1b1a24; --line: #2a2838;
    --text: #ece8e1; --secondary: #b3aec2; --hint: #9f99b2;
    --accent: #b9a6ff; --accent-bg: #24203a; --attention: #f6b26b; --error: #f2666b; --ok: #8fd6a4;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--sans); }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .wordmark { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .wordmark span { color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-bg); color: var(--accent);
          border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.attention { color: var(--attention); } .pill.error { color: var(--error); }
  h2 { color: var(--hint); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0 2px 10px;
       font-weight: 600; }
  .card { background: var(--card); border-radius: 14px; }
  /* Status: on a phone, label beside value in a list. Only direct children are rows: the value's own lines
     must not inherit the row grid (they once did, squeezing every value into the label's width). */
  .now { padding: 6px 16px; }
  .now > .stat { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; }
  .now > .stat + .stat { border-top: 1px solid var(--line); }
  .label { color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: 1px; padding-top: 3px; }
  .line { overflow-wrap: anywhere; }
  .detail { color: var(--hint); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .logs { padding: 6px 0; }
  .logs a { display: flex; justify-content: space-between; gap: 16px; padding: 8px 16px; color: var(--secondary);
            text-decoration: none; font-size: 14px; }
  .logs a .name { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .logs a .size { font-variant-numeric: tabular-nums; color: var(--hint); white-space: nowrap; }
  .logs a:hover, .logs a:focus-visible { color: var(--accent); background: var(--row); }
  .logs .more { margin: 6px 16px 8px; }
  details { background: var(--row); border-radius: 12px; margin: 0 0 8px; }
  summary { min-height: 48px; padding: 12px 16px; cursor: pointer; list-style: none; display: flex;
            justify-content: space-between; align-items: center; font-weight: 500; border-radius: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "\203A"; color: var(--hint); font-size: 20px; line-height: 1; transition: transform 0.15s; }
  details[open] summary::after { transform: rotate(90deg); }
  .setting { padding: 12px 16px 14px; border-top: 1px solid var(--line); }
  .setting .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; align-items: center; }
  .setting .top > span { min-width: 0; flex: 1 1 12em; }
  .setting .cost, .setting .help { color: var(--hint); font-size: 13px; margin-top: 6px; max-width: 62ch; }
  .setting .cost { color: var(--secondary); }
  .setting .err { color: var(--error); font-size: 13px; margin-top: 4px; }
  .setting .err:empty { display: none; }
  select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                  min-height: 40px; padding: 6px 10px; font: inherit; max-width: 100%; }
  select { min-width: 9em; }
  input[type=text] { width: 14em; }
  input[type=number] { width: 8em; font-variant-numeric: tabular-nums; }
  button { background: var(--accent-bg); color: var(--accent); border: 1px solid #3a3358; border-radius: 8px;
           min-height: 40px; padding: 6px 14px; font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { color: var(--hint); font-size: 13px; text-align: center; padding: 8px 0 4px; }
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); grid-template-areas:
           "head head" "status settings" "runs settings" "foot foot"; padding: 28px 32px; gap: 28px 32px; align-items: start; }
    /* On a phone the settings come straight after the status, the logs last; here the logs sit under
       the status and the settings keep the side column. */
    header { grid-area: head; } #status { grid-area: status; } #settings { grid-area: settings; }
    #runs { grid-area: runs; }
    footer { grid-area: foot; }
    #settings { position: sticky; top: 28px; max-height: calc(100vh - 56px); overflow-y: auto; }
    /* Status as tiles: each reads label, value, detail, top to bottom. Two or four across, never three, so
       the four rows the status has never leave one tile alone on a line. */
    .now { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0;
           background: none; }
    .now > .stat { display: block; background: var(--card); border-radius: 14px; padding: 14px 16px 16px; }
    .now > .stat + .stat { border-top: none; }
    .now .line { font-size: 18px; font-weight: 500; margin-top: 6px; line-height: 1.3; }
    .wordmark { font-size: 28px; }
  }
  @media (min-width: 1300px) { .now { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header><div class="wordmark">cine<span>fit</span></div><div id="pill" class="pill">…</div></header>
  <section id="status">
    <div class="card now" id="now"></div>
  </section>
  <section id="settings">
    <h2>Settings</h2>
    <div id="pages"></div>
  </section>
  <section id="runs">
    <h2>Recent runs and logs</h2>
    <div class="card logs" id="logs"></div>
  </section>
  <footer id="version"></footer>
</main>
<script>
"use strict";
const PAGES = ["Picture", "Output", "Screen", "Input", "Receiver", "Web page"];
// The menu's names for the table's values.
const NAMES = { on: "On", off: "Off", passthrough: "To the projector",
  sdr2020: "Tone-mapped to SDR BT.2020", limited: "Limited", full: "Full" };
const el = (tag, cls, text) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
let built = false;
const rows = {};   // key -> { control, err }

async function post(key, value, row) {
  row.err.textContent = "";
  try {
    const r = await fetch("/api/set", { method: "POST", body: JSON.stringify({ key, value }) });
    const j = await r.json();
    if (!r.ok) row.err.textContent = j.error || "refused";
  } catch (e) { row.err.textContent = "cinefit did not answer"; }
}

function control(s) {
  const k = s.kind;
  let c;
  if (k.type === "choice") {
    c = el("select");
    for (const v of k.choices) { const o = el("option", "", NAMES[v] || v); o.value = v; c.append(o); }
    c.onchange = () => post(s.key, c.value, rows[s.key]);
  } else {
    c = el("input");
    c.type = k.type === "text" || k.type === "ratio" ? "text" : "number";
    if (k.type === "int") c.step = "1";
    if (k.type === "float") c.step = "any";
    if (k.min !== undefined && c.type === "number") { c.min = k.min; c.max = k.max; }
    if (k.type === "ratio") c.placeholder = "2.35 or 16:9";
    c.onchange = () => post(s.key, c.value, rows[s.key]);
  }
  return c;
}

// Pairing the Apple TV (#115): Pair asks it to show a PIN, which is typed
// in here. Once is enough unless the Apple TV forgets cinefit.
function pairing() {
  const row = el("div", "setting"), top = el("div", "top");
  const btn = el("button", "", "Pair");
  top.append(el("span", "", "Apple TV pairing"), btn);
  const pinRow = el("div", "top"); pinRow.style.display = "none"; pinRow.style.marginTop = "8px";
  const pin = el("input"); pin.type = "text"; pin.inputMode = "numeric"; pin.placeholder = "PIN on the TV";
  const ok = el("button", "", "Pair with this PIN");
  pinRow.append(pin, ok);
  const err = el("div", "err"), msg = el("div", "help");
  row.append(top, pinRow, err, msg);
  async function refresh() {
    try {
      const j = await (await fetch("/api/atv", { cache: "no-store" })).json();
      msg.textContent = j.paired
        ? "Paired. Pair again only if the Apple TV has forgotten cinefit."
        : "Not paired: cinefit cannot read what the Apple TV plays until it is. Set its address above first.";
    } catch (e) {}
  }
  btn.onclick = async () => {
    err.textContent = ""; btn.disabled = true;
    try {
      const r = await fetch("/api/atv/pair/start", { method: "POST" }); const j = await r.json();
      if (!r.ok) err.textContent = j.error || "refused";
      else { pinRow.style.display = "flex"; pin.value = ""; pin.focus(); msg.textContent = "Type the PIN the Apple TV is showing."; }
    } catch (e) { err.textContent = "cinefit did not answer"; }
    btn.disabled = false;
  };
  ok.onclick = async () => {
    err.textContent = ""; ok.disabled = true;
    try {
      const r = await fetch("/api/atv/pair/finish", { method: "POST", body: JSON.stringify({ pin: pin.value }) });
      const j = await r.json();
      if (!r.ok) err.textContent = j.error || "refused";
      pinRow.style.display = "none";
    } catch (e) { err.textContent = "cinefit did not answer"; }
    ok.disabled = false; refresh();
  };
  refresh();
  return row;
}

function build(settings) {
  const pages = document.getElementById("pages");
  for (const page of PAGES) {
    const d = el("details"); const sum = el("summary", "", page); d.append(sum);
    for (const s of settings.filter(x => x.page === page)) {
      const row = el("div", "setting"), top = el("div", "top");
      top.append(el("span", "", s.label));
      const c = control(s); top.append(c);
      const err = el("div", "err");
      row.append(top, el("div", "cost", s.cost), err);
      const help = el("div", "help", s.help); row.append(help);
      d.append(row);
      rows[s.key] = { control: c, err };
    }
    if (page === "Receiver") d.append(pairing());
    pages.append(d);
  }
  built = true;
}

function update(state) {
  const pill = document.getElementById("pill");
  pill.textContent = state.pill || "…";
  pill.className = "pill" + (state.pill === "Waiting" ? " attention" : state.pill === "Can't show this" ? " error" : "");
  const now = document.getElementById("now"); now.replaceChildren();
  for (const s of state.now || []) {
    const r = el("div", "stat"); r.append(el("div", "label", s.label));
    const v = el("div"); v.append(el("div", "line", s.line), el("div", "detail", s.detail)); r.append(v);
    now.append(r);
  }
  if (!built && state.settings) build(state.settings);
  for (const s of state.settings || []) {
    const r = rows[s.key];
    // Never overwrite what someone is typing.
    if (r && document.activeElement !== r.control) r.control.value = s.value;
  }
  document.getElementById("version").textContent = "cinefit " + (state.version || "");
}

async function poll() {
  try { update(await (await fetch("/api/state", { cache: "no-store" })).json()); }
  catch (e) { document.getElementById("pill").textContent = "No answer"; }
}

// The newest few logs show; the rest wait behind a button, which stays as
// chosen across the half-minute refresh.
const LOGS_SHOWN = 6;
let allLogs = false;
async function logs() {
  const list = document.getElementById("logs");
  try {
    const all = await (await fetch("/api/logs")).json();
    list.replaceChildren();
    for (const l of allLogs ? all : all.slice(0, LOGS_SHOWN)) {
      const a = el("a");
      a.append(el("span", "name", l.name), el("span", "size", Math.max(1, Math.round(l.size / 1024)) + " KB"));
      a.href = "/api/logs/" + encodeURIComponent(l.name); a.target = "_blank"; list.append(a);
    }
    if (all.length > LOGS_SHOWN) {
      const b = el("button", "more", allLogs ? "Show fewer" : "Show all " + all.length);
      b.onclick = () => { allLogs = !allLogs; logs(); };
      list.append(b);
    }
  } catch (e) {}
}

poll(); logs();
setInterval(poll, 1000);
setInterval(logs, 30000);
</script>
</body>
</html>
