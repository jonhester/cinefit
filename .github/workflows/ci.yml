name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux, the only platform cinefit runs on. The DeckLink shim builds
    # against the vendored SDK headers; no driver is needed to build or to run
    # the tests. 26.04 because its libplacebo (7.360) is the one the rig runs.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libplacebo-dev libvulkan-dev libdrm-dev
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
