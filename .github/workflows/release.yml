name: Release

# A pushed tag vMAJOR.MINOR.PATCH publishes that release: one archive,
# x86-64-v3 (any x86 CPU from about 2015 on), and its checksum. Made by
# tools/release.sh patch|minor|major, which bumps Cargo.toml to match.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The tag must name the version Cargo.toml holds at it: the binary
      # reports Cargo.toml's.
      - id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$v" ] ||
            { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          meson ninja-build glslang-dev glslang-tools python3-jinja2
          libvulkan-dev liblcms2-dev libdrm-dev libgbm-dev
      - id: libplacebo
        uses: actions/cache@v6
        with:
          path: .deps/libplacebo
          key: libplacebo-${{ runner.os }}-${{ hashFiles('scripts/build-libplacebo.sh') }}
      - if: steps.libplacebo.outputs.cache-hit != 'true'
        run: scripts/build-libplacebo.sh
      - run: rustup toolchain install stable --profile minimal
      # What is published passed the tests, at this commit.
      - run: cargo test --workspace --locked
      - env:
          CINEFIT_RELEASE: "1"
          VERSION: ${{ steps.version.outputs.version }}
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          set -eu
          cargo build --release --locked -p cinefit
          # The binary says the version it was built as.
          target/release/cinefit --version | grep -F "cinefit $VERSION ("
          tools/package.sh target/release/cinefit "$VERSION" dist
          tools/deb.sh target/release/cinefit "$VERSION" dist
          # The package again under a name without the version, so the guide
          # can give one link that is always the latest:
          # releases/latest/download/cinefit_amd64.deb.
          cp "dist/cinefit_${VERSION}_amd64.deb" dist/cinefit_amd64.deb
          (cd dist && sha256sum -- *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --title "cinefit $VERSION" --generate-notes
