name: Release

# A tag vMAJOR.MINOR.PATCH (tools/version.sh tag) publishes that release: one
# archive, x86-64-v3 (any x86 CPU from about 2015 on), and its checksum.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(tools/version.sh check "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          meson ninja-build glslang-dev glslang-tools python3-jinja2
          libvulkan-dev liblcms2-dev libdrm-dev libgbm-dev
      - id: libplacebo
        uses: actions/cache@v6
        with:
          path: .deps/libplacebo
          key: libplacebo-${{ runner.os }}-${{ hashFiles('scripts/build-libplacebo.sh') }}
      - if: steps.libplacebo.outputs.cache-hit != 'true'
        run: scripts/build-libplacebo.sh
      - run: rustup toolchain install stable --profile minimal
      # What is published passed the tests, at this commit.
      - run: cargo test --workspace --locked
      - env:
          CINEFIT_VERSION: ${{ steps.version.outputs.version }}
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          set -eu
          cargo build --release --locked -p cinefit
          # The binary says the version it was built as.
          target/release/cinefit --version | grep -F "cinefit $CINEFIT_VERSION ("
          tools/package.sh target/release/cinefit "$CINEFIT_VERSION" dist
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --title "cinefit $VERSION" --generate-notes
