name: Guide

# The user guide (docs/guide), built with docmd and published to Cloudflare
# Pages. The published guide is the released one: only a release tag,
# vMAJOR.MINOR.PATCH and nothing after it (made by tools/release.sh, the
# same push that starts release.yml), deploys to production, so the guide
# never describes a setting or command that the latest release does not
# have. A prerelease tag (v0.2.0-beta.1, v0.2.0-rc.1) goes to the `next`
# preview alias (next.cinefit.org), the guide for what is about to be
# released. Only the newest of each counts (deploy-targets.py): a patch to
# an older line leaves both alone. main deploys nothing; a PR only builds,
# so broken links show. Only the guide's own files start it on a branch: Rust changes do
# not need Node. The settings page is generated from the settings table
# and checked by `cargo test` in CI.
#
# The Pages project is a direct-upload one (no Git connection in
# Cloudflare), and needs the CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID repository secrets.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["docs/guide/**", ".github/workflows/guide.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: docs/guide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/guide/.nvmrc
          cache: npm
          cache-dependency-path: docs/guide/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx docmd validate
      - run: npx docmd build
      # Production is the project's `main` branch in Cloudflare's terms;
      # any other branch name is a preview, here aliased as next. Which of
      # them a tag goes to is by SemVer against every tag in the repository
      # (deploy-targets.py), so an older line's patch never replaces the
      # newest guide.
      - if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --tags --force origin
          targets=$(python3 deploy-targets.py "$TAG" $(git tag --list 'v*'))
          [ -n "$targets" ] || echo "$TAG is not the newest of its kind: the guide is not deployed"
          for branch in $targets; do
            npx --yes wrangler@4 pages deploy site --project-name=cinefit --branch="$branch"
          done
