# The cinefit system user, made by systemd-sysusers when the package is
# configured: no login, home in its state directory, and the groups that let
# it drive the display, use the GPU and read the remote.
u cinefit - "cinefit video processor" /var/lib/cinefit /usr/sbin/nologin
m cinefit video
m cinefit render
m cinefit input
