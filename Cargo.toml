[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# The last release; tools/release.sh bumps it. Builds between releases say
# VERSION+dev (crates/cinefit/build.rs).
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonhester/cinefit"

[workspace.dependencies]

[workspace.lints.clippy]
# Every `unsafe` block must say why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
